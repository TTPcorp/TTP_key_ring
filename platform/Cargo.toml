[package]
name = "llavero-platform"
description = "OS abstraction traits and per-OS implementations (Windows first)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "3", default-features = false }
thiserror = "2"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop"] }

[lints]
workspace = true
