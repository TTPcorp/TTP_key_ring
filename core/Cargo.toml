[package]
name = "llavero-core"
description = "Portable core: vault format, encryption, entry model, password generator, web address checks and matching. No OS or Tauri dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "serde-well-known"] }
url = "2"
zxcvbn = { version = "3", default-features = false }
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
zeroize = "1.9"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
