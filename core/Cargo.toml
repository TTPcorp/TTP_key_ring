[package]
name = "llavero-core"
description = "Portable core: vault format, encryption, entry model, password generator and matching. No OS or Tauri dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
secrecy = "0.10"
thiserror = "2"
zeroize = "1.9"

[lints]
workspace = true
