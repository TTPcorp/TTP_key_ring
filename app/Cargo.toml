[package]
name = "llavero-app"
description = "Tauri 2 desktop application: UI and commands."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
llavero-core = { path = "../core" }
llavero-platform = { path = "../platform" }
dirs = "7"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
zeroize = "1.9"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
