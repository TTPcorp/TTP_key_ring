[workspace]
resolver = "3"
members = ["core", "platform", "app", "native-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.cargo]
# Manifest warnings are not covered by `clippy -- -D warnings`.
unused_dependencies = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"

# Argon2 is far too slow without optimizations; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
