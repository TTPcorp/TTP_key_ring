# Dependabot: weekly update PRs. Every PR goes through CI (including
# cargo-deny) and must be reviewed by a person before merging.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps in one PR; major bumps get their own PR.
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # svelte-check 4 only supports TypeScript 5/6 (peer dependency).
      # Remove this once svelte-check supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
